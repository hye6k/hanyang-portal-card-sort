<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>실험 응답 확인</title><link rel="icon" href="../favicon.svg"><link rel="stylesheet" href="../survey/style.css?v=survey-5"><link rel="stylesheet" href="../study/groups.css?v=group-design-1"><link rel="stylesheet" href="./style.css?v=compact-4"></head><body><main class="page">
<header class="page-heading"><h1>실험 응답 확인</h1><div class="tools"><label class="file-button" for="files">JSON 열기</label><input id="files" type="file" accept=".json,.txt,application/json,text/plain" multiple hidden><button id="clear">비우기</button><span id="count"></span></div></header>
<details class="paste"><summary>JSON 붙여넣기</summary><textarea id="paste" rows="3" aria-label="JSON 응답"></textarea><button id="load-paste">불러오기</button></details><p id="status" role="status"></p>
<div id="workspace" hidden><nav class="tabs" aria-label="응답 내용"><button data-tab="pre" aria-pressed="true">사전 설문</button><button data-tab="groups" aria-pressed="false">그룹과 카드</button><button data-tab="post" aria-pressed="false">사후 답변</button></nav>
<section id="pre"><div class="table-wrap"><table><thead><tr><th>학번</th><th>학과</th><th>이름</th><th>02 이용 빈도</th><th>03 탐색 어려움</th><th>04 어려웠던 기능 · 이유</th><th>05 탐색 용이성</th><th>동의</th></tr></thead><tbody id="pre-rows"></tbody></table></div></section>
<section id="groups" hidden><div class="person-controls"><button id="previous" aria-label="이전 응답">‹</button><select id="person" aria-label="응답자"></select><button id="next" aria-label="다음 응답">›</button><button id="download">원본</button></div><div id="group-list"></div></section>
<section id="post" hidden><div class="table-wrap"><table><thead><tr><th>응답자</th><th>애매했던 메뉴 · 이유</th><th>명칭 이해도</th><th>고려한 분류 기준</th><th>동의</th></tr></thead><tbody id="post-rows"></tbody></table></div></section>
</div></main><script type="module" src="./app.js?v=compact-4"></script></body></html>
