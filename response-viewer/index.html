<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f2f5f8"><meta name="robots" content="noindex,nofollow"><title>저장된 실험 응답 확인</title><link rel="icon" href="../favicon.svg"><link rel="stylesheet" href="../survey/style.css?v=survey-5"><link rel="stylesheet" href="../study/groups.css?v=group-design-1"><link rel="stylesheet" href="./style.css?v=inspection-2"></head><body>
<main class="page"><header class="page-heading"><h1>저장된 실험 응답 확인</h1></header>
<section class="question import"><div class="actions"><label class="secondary-button" for="files">JSON 파일 열기</label><input type="file" id="files" accept=".json,.txt,application/json,text/plain" multiple hidden><button class="text-button" id="clear">비우기</button></div><label class="paste-label" for="paste">또는 JSON을 붙여넣어 주세요.</label><textarea id="paste" rows="4" spellcheck="false"></textarea><div class="submit-bar"><button class="primary-button" id="load-paste">응답 확인</button></div><p class="question-hint">입력한 데이터는 이 브라우저에서만 확인하며, 서버로 전송하거나 별도로 저장하지 않습니다.</p><p id="status" role="status" aria-live="polite">아직 불러온 JSON이 없습니다.</p><ul id="errors"></ul></section>
<div id="workspace" hidden><section class="question record-picker"><label for="record">확인할 응답</label><select id="record"></select><div class="actions"><button id="download" class="text-button">불러온 원본 내려받기</button><button id="print" class="text-button">인쇄 / PDF 저장</button></div></section>
<nav class="section-nav" aria-label="응답 항목"><a href="#meta">저장 정보</a><a href="#pre">사전 설문</a><a href="#sort">카드 분류</a><a href="#post">사후 질문</a><a href="#views">설명 열람</a><a href="#cards">카드 원본</a><a href="#audit">전체 필드</a></nav>
<div id="report" class="response-fields"></div>
<section class="question" id="audit"><div class="question-heading"><h2>원본의 모든 필드</h2></div><p class="question-hint">불러온 파일 전체의 경로·자료형·값입니다. 빈 문자열, 빈 배열, false, null과 알 수 없는 추가 필드도 생략하지 않습니다.</p><p id="coverage"></p><div id="field-tree"></div></section>
<section class="question" id="raw"><div class="question-heading"><h2>불러온 원본 전체</h2></div><p class="question-hint">입력한 텍스트 그대로 표시합니다. 아래 원본은 파일 내려받기로도 보관할 수 있습니다.</p><pre id="raw-json"></pre></section>
</div></main><script type="module" src="./app.js?v=inspection-2"></script></body></html>
