<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#172e46">
  <meta name="robots" content="noindex,nofollow">
  <title>카드 묶기 · UI 테스트</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <a class="skip" href="#main">카드 분류로 이동</a>
  <header class="header"><div class="header-content"><div class="brand"><span class="brand-icon" aria-hidden="true"><i></i><i></i><i></i><i></i></span><strong>카드 묶기</strong><span class="test-badge">UI 테스트</span></div><button type="button" class="reset-button" data-action="reset">처음부터</button></div></header>
  <main id="main"><div id="app"></div></main>
  <dialog id="move-dialog" class="sheet" aria-labelledby="move-title"></dialog>
  <dialog id="confirm-dialog" class="confirmation" aria-labelledby="confirm-title"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  <noscript>카드를 묶으려면 브라우저에서 JavaScript를 사용할 수 있어야 한다.</noscript>
  <script type="module" src="./app.js"></script>
</body>
</html>
