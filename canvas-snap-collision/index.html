<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f2f5f8">
  <meta name="robots" content="noindex,nofollow">
  <title>자유 배치 카드 소팅 · 병합 자동 정렬 · 충돌</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css?v=snap-collision-12">
</head>
<body>
  <main id="viewport" aria-label="카드를 자유롭게 배치하는 평면"><div id="world"><div id="outlines"></div><div id="cards"></div></div></main>
  <p id="hint" class="hint">카드 끌기 · 0.5초 꾹 누르면 그룹 이동</p>
  <nav class="controls" aria-label="평면 조작">
    <div class="control-set" role="group" aria-label="보기 조절"><button type="button" data-action="fit" class="small-button" aria-label="전체 카드 보기">전체 보기</button></div>
    <span class="divider" aria-hidden="true"></span>
    <div class="control-set history-controls" role="group" aria-label="이동 내역"><button type="button" data-action="undo" class="icon-button history-button" aria-label="뒤로가기" title="뒤로가기" disabled><svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m9 14-5-5 5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-2"/></svg></button><button type="button" data-action="redo" class="icon-button history-button" aria-label="앞으로가기" title="앞으로가기" disabled><svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(24 0) scale(-1 1)"><path d="m9 14-5-5 5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-2"/></g></svg></button></div>
    <span class="divider" aria-hidden="true"></span><button type="button" data-action="review" class="review-button">그룹 확인</button>
  </nav>
  <button type="button" data-action="reset-test" class="reset-test" title="배치와 분류를 지우고 다시 시작" aria-label="저장된 테스트 배치와 분류 초기화">초기화</button>
  <section id="card-detail" class="card-detail" role="dialog" aria-modal="false" aria-labelledby="detail-title" aria-describedby="detail-description" hidden>
    <button type="button" class="detail-close" id="close-card-detail" aria-label="설명 닫기">×</button>
    <h2 id="detail-title"></h2>
    <p id="detail-description"></p>
    <button type="button" class="detail-create" id="start-single-group">이 카드로 그룹 만들기</button>
    <form id="single-group-form" hidden>
      <label for="single-group-name">그룹 이름</label>
      <div class="single-group-row"><input id="single-group-name" type="text" maxlength="60" autocomplete="off"><button type="submit">만들기</button></div>
    </form>
  </section>
  <dialog id="review" aria-label="그룹 확인"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  <noscript>카드를 배치하려면 JavaScript를 사용할 수 있어야 한다.</noscript>
  <script type="module" src="./app.js?v=journey-2"></script>
  <script type="module" src="../study/tutorial.js?v=journey-2"></script>
</body>
</html>
